name: Web Automation CI/CD & Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # Daily run at 01:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy-report:
    name: Run Web Automation & Publish Allure Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Web Automation Tests
        if: always()
        env:
          ESUITE_BASE_URL: ${{ secrets.ESUITE_BASE_URL || 'https://esuite.edot.id' }}
          ESUITE_EMAIL: ${{ secrets.ESUITE_EMAIL || 'it.qa@edot.id' }}
          ESUITE_PASSWORD: ${{ secrets.ESUITE_PASSWORD || 'it.QA2025' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY || '' }}
          HEADLESS: "true"
        run: |
          pytest web/tests --alluredir=allure-results

      - name: Get Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report with History Trend
        uses: simple-elf/allure-report-action@v1.9
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 30

      - name: Deploy Allure Report to GitHub Pages (gh-pages Branch)
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
