name: Web Automation CI/CD & Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # Daily run at 01:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy-report:
    name: Run Web Automation & Publish Allure Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Web Automation Tests
        if: always()
        env:
          ESUITE_BASE_URL: ${{ secrets.ESUITE_BASE_URL || 'https://esuite.edot.id' }}
          ESUITE_EMAIL: ${{ secrets.ESUITE_EMAIL || 'it.qa@edot.id' }}
          ESUITE_PASSWORD: ${{ secrets.ESUITE_PASSWORD || 'it.QA2025' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY || '' }}
          HEADLESS: "true"
        run: |
          pytest web/tests --alluredir=allure-results

      - name: Install Allure CLI & Java
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxvf allure-2.29.0.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Get Previous Allure History from gh-pages Branch
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Generate Allure Report with History Trend
        if: always()
        run: |
          mkdir -p allure-results/history
          if [ -d "gh-pages-dir/history" ]; then
            cp -r gh-pages-dir/history/* allure-results/history/ || true
          fi
          allure generate allure-results -o allure-report --clean

      - name: Deploy Allure Report to GitHub Pages (gh-pages Branch)
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
